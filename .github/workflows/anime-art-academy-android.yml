name: Anime Art Academy - Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - "anime-art-academy/**"
      - ".github/workflows/anime-art-academy-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-art-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Anime-Art-Academy-APK
          path: anime-art-academy/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
