name: Anime Art Academy - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "anime-art-academy/**"
      - ".github/workflows/anime-art-academy-android.yml"

permissions:
  contents: read

concurrency:
  group: anime-art-academy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-art-academy

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Anime-Art-Academy-APK
          path: anime-art-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
