name: Anime Art Academy - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "anime-art-academy/**"
      - ".github/workflows/anime-art-academy-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-art-academy

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK archive and package metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/anime-art-badging.txt
          grep -q "name='com.animeartacademy'" /tmp/anime-art-badging.txt
          grep -q "versionName='0.9.0'" /tmp/anime-art-badging.txt
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Anime-Art-Academy-APK
          path: anime-art-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
